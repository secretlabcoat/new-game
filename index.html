<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noon Panic 8-Bit</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="hud">
        <div><span class="label">Score</span><span id="score">0</span></div>
        <div><span class="label">Cash</span><span id="cash">0</span></div>
        <div><span class="label">Timer</span><span id="timer">90</span></div>
        <div><span class="label">Lives</span><span id="lives">3</span></div>
        <div><span class="label">Rescue</span><span id="hostages">0</span></div>
      </div>

      <canvas id="game" width="640" height="360" aria-label="Retro Nintendo-styled bank robbery game"></canvas>

      <div id="overlay" class="overlay visible">
        <div class="panel">
          <div class="panel-tag">NES STYLE HEIST</div>
          <h1>Noon Panic</h1>
          <p>Grab the stash, rescue your crew, and sprint to the getaway.</p>
          <ul>
            <li>Move: WASD / Arrow Keys</li>
            <li>Collect cash</li>
            <li>Rescue hostages</li>
            <li>Reach the getaway before time expires</li>
          </ul>
          <button id="startBtn">Start</button>
        </div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
